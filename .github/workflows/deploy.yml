name: Build & Deploy to GitHub Pages

# 部署來源固定為 rebuild 分支（目前的主力開發分支）。
# 排程觸發時 GitHub 一律跑「預設分支」上的 workflow 檔，
# 因此 checkout 明確釘 ref: rebuild，避免 cron 抓到落後的 main 蓋掉新站。
# 日後若要改從 main 部署：把 branches 與下面的 ref 一起換掉即可。
on:
  push:
    branches: [rebuild]
  schedule:
    # 每天 UTC 22:00（台北時間早上 6 點）自動重建，同步 Notion 燈號
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只允許一個部署在跑，排程與手動觸發不會互相踩踏
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rebuild

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
