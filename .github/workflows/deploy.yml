name: Build and deploy to Oracle Cloud VM

# schedule 與 workflow_dispatch 都要求此檔存在於預設分支。
on:
  push:
    branches: [rebuild]
  schedule:
    # 每天 UTC 22:00（台北時間早上 6 點）自動重建，同步 Notion 燈號
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wormbakery-vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild
        uses: actions/checkout@v4
        with:
          ref: rebuild

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}

      - name: Deploy verified release
        shell: bash
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VM_SSH_PRIVATE_KEY"
          test -n "$VM_SSH_KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/wormbakery-ssh"
          key="$RUNNER_TEMP/wormbakery-ssh/id_ed25519"
          known_hosts="$RUNNER_TEMP/wormbakery-ssh/known_hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          (umask 077; printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$key"; printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$known_hosts")
          chmod 600 "$key" "$known_hosts"
          ssh-keygen -y -f "$key" > /dev/null
          VM_SSH_KEY_PATH="$key" VM_SSH_KNOWN_HOSTS_PATH="$known_hosts" bash scripts/deploy-vm.sh
